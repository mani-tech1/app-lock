name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the Android project folder
        id: proj
        run: |
          echo "---- files in repo ----"
          ls -la
          if [ -z "$(find . -maxdepth 3 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)" ]; then
            z=$(ls ./*.zip 2>/dev/null | head -n 1)
            if [ -n "$z" ]; then
              echo "Unzipping $z"
              unzip -q "$z" -d _unzipped
            fi
          fi
          f=$(find . -maxdepth 3 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write local.properties
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL=${{ vars.BACKEND_URL }}" >> local.properties
          fi

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLocker-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
